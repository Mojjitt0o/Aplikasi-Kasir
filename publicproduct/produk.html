<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Produk - Aplikasi Kasir</title>
    <link rel="stylesheet" href="styles.css">
    <!-- CDN untuk FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navigasi -->
    <nav class="navbar">
        <h1>Aplikasi Kasir</h1>
        <ul>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/produk" class="active">Produk</a></li>
            <li><a href="/transaksi">Transaksi</a></li>
            <li><a href="/laporan">Laporan</a></li>
        </ul>
    </nav>

    <!-- Menu Produk -->
    <main class="product-container">
        <h2>Daftar Produk</h2>

        <!-- Tombol Tambah Produk -->
        <button class="add-product-btn" onclick="showAddProductPopup()">+ Tambah Produk</button>

        <!-- Input Pencarian Produk -->
        <input type="text" id="searchProduct" placeholder="Cari produk..." onkeyup="searchProduct()">

        <!-- Tabel Daftar Produk -->
        <table class="product-table">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama Produk</th>
                    <th>Harga</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="productList">
                <!-- Data produk akan diisi oleh script.js -->
            </tbody>
        </table>
    </main>

    <!-- Pop-up Form Tambah/Edit Produk -->
    <div class="popup" id="productPopup">
        <div class="popup-content">
            <h3 id="popupTitle">Tambah Produk</h3>
            <form id="productForm">
                <input type="hidden" id="productId">
                <input type="text" id="productName" placeholder="Nama Produk" required>
                <input type="number" id="productPrice" placeholder="Harga" required>
                <input type="number" id="productStock" placeholder="Stok" required>
                <button type="submit" id="submitProductBtn">Simpan</button>
                <button type="button" class="cancel-btn" onclick="closePopup()">Batal</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
